<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Whiteboard — Vanilla JS</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
<button id="state-details" type="button">!</button>

<div id="titlebar">
  <pear-ctrl></pear-ctrl>
  <p id="version">1.0.7</p>
</div>

<!--Canvas Create/Join Setup-->
<div id="setup" style="z-index: 999; overflow: hidden">
  <div id="rooms-list-container">
    <div style="display: flex; flex-direction: column; gap: 16px; height: 90%">
    <h5 style="padding: 0 8px">Canvas Room History</h5>
    <div id="rooms-list" class="">
    </div>
    </div>
    <div class="account-details hidden" style="display: flex; flex-direction: row; align-items: center; gap: 4px;">
      <button id="logout-btn" type="button">Logout <i class="fas fa-sign-out icon" title="Logout icon"></i></button>
      <button id="account-btn" type="button">Account Info ! </button>
    </div>
  </div>
  <div id="create-join-container">
    <div id="room-name-form" class="hidden" style="display: flex; flex-direction: row; gap: 4px;">
      <button class="button"  type="button" id="room-name-btn"><img class="icon" src="assets/icons/join.png" alt="icon" />Add Name</button>
      <input required id="room-name-input" type="text" placeholder="Canvas Name!!!" />
    </div>
  <div>
    <button class="button" id="create-canvas"><img class="icon" src="assets/icons/create.png" alt="icon" />Create</button>
  </div>
  <div id="or">
    - or -
  </div>
  <div id="join-form" style="display: flex; flex-direction: row; gap: 4px;">
    <button class="button"  type="button" id="join-canvas"><img class="icon" src="assets/icons/join.png" alt="icon" />Join</button>
    <input required id="join-canvas-topic" type="text" placeholder="Canvas Topic!!!" />
  </div>
  </div>
</div>
<div id="board-bar" class="hidden">
  <span id="board-name"></span>
  <button type="button" id="board-rooms" title="Back to your boards">
    <svg viewBox="0 0 24 24" width="15" height="15"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11,5 4,12 11,19"/><line x1="4" y1="12" x2="19" y2="12"/></g></svg>
    Boards
  </button>
  <button type="button" id="board-exit" title="Close PearBoard">
    <svg viewBox="0 0 24 24" width="15" height="15"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 H6 a2 2 0 0 0 -2 2 v10 a2 2 0 0 0 2 2 h4"/><polyline points="15,8 19,12 15,16"/><line x1="19" y1="12" x2="9" y2="12"/></g></svg>
    Exit
  </button>
</div>

<div id="loading" class="loader-container hidden">
  <div class="loader"></div>
</div>
<header class="toolbar hidden" role="toolbar" aria-label="Whiteboard toolbar">
  <div class="btn--container">
  <div class="group" id="tools" style="gap: 4px;">
    <button class="btn" data-tool="select" title="Select and move (V)"><img class="icon" src="./assets/icons/pointer.svg" alt="icon" /></button>
    <button class="btn active" data-tool="pen" title="Pen (P)"><img class="icon" src="./assets/icons/pen.png" alt="icon" /></button>
    <button class="btn" data-tool="eraser" title="Eraser (E)"><img class="icon" src="assets/icons/eraser.png" alt="icon" /></button>
    <button class="btn" data-tool="arrow" title="Arrow (A)"><img class="icon" src="./assets/icons/arrow-tool.svg" alt="icon" /></button>
    <button class="btn" data-tool="line" title="Line (L)"><img class="icon" src="assets/icons/line.png" alt="icon" /></button>
    <button class="btn" data-tool="rect" title="Rectangle (R)"><img class="icon" src="assets/icons/rect.png" alt="icon" /></button>
    <button class="btn" data-tool="ellipse" title="Ellipse (O)"><img class="icon" src="assets/icons/ellipse.png" alt="icon" /></button>
    <button class="btn" data-tool="diamond" title="Diamond (D)"><img class="icon" src="assets/icons/diamond.png" alt="icon" /></button>
    <div class="divider"></div>
    <button class="btn" data-tool="text" title="Text (T)"><img class="icon" src="./assets/icons/text-tool.svg" alt="icon" /></button>
    <button class="btn" data-tool="hand" title="Hand (H)"><img class="icon" src="assets/icons/hand.png" alt="icon" /></button>
    <div class="divider"></div>
    <button id="undo" class="btn" title="Undo (Ctrl/Cmd+Z)"><img class="icon" src="assets/icons/undo.png" alt="icon" /></button>
    <button id="redo" class="btn" title="Redo (Ctrl/Cmd+Shift+Z)"><img class="icon" src="assets/icons/redo.png" alt="icon" /></button>
    <div class="divider"></div>
    <button id="slide-icon-btn" class="btn" title="Icons"><img src="./assets/icons/gallery.png" class="icon" alt="clean-icon"></button>
    <button id="clear" class="btn" title="Clear"><img src="./assets/icons/clean.png" class="icon" alt="clean-icon"></button>
  </div>
  </div>
  <div class="drawing-controls">
    <button type="button" id="toggleControls" class="controls-toggle" aria-label="Toggle properties panel" aria-expanded="false">
      <img class="icon" src="assets/icons/options.png" alt="Drawing options" />
      <h5 id="settings-title">Settings</h5>
    </button>

    <div class="controls-container" id="controlsContainer">
      <div class="prop-tabs" role="tablist">
        <button type="button" class="prop-tab active" data-tab="stroke" role="tab">Stroke</button>
        <button type="button" class="prop-tab" data-tab="background" role="tab">Background</button>
      </div>

      <div class="prop-group" id="colorGroup" data-tab="stroke">
        <label class="prop-label">Stroke</label>
        <div class="swatch-row">
          <button type="button" class="swatch" data-color="#1e1e1e" style="--swatch:#1e1e1e" title="Black"></button>
          <button type="button" class="swatch" data-color="#e03131" style="--swatch:#e03131" title="Red"></button>
          <button type="button" class="swatch" data-color="#2f9e44" style="--swatch:#2f9e44" title="Green"></button>
          <button type="button" class="swatch" data-color="#1971c2" style="--swatch:#1971c2" title="Blue"></button>
          <button type="button" class="swatch" data-color="#f08c00" style="--swatch:#f08c00" title="Orange"></button>
          <span class="swatch-divider"></span>
          <span class="swatch-custom" title="Custom colour">
            <input id="color" type="color" value="#1e1e1e" />
          </span>
        </div>
      </div>

      <div class="prop-group" id="backgroundGroup" data-tab="background">
        <label class="prop-label">Background</label>
        <div class="swatch-row">
          <button type="button" class="swatch swatch-transparent" data-bg="transparent" title="Transparent"></button>
          <button type="button" class="swatch" data-bg="#ffc9c9" style="--swatch:#ffc9c9" title="Red"></button>
          <button type="button" class="swatch" data-bg="#b2f2bb" style="--swatch:#b2f2bb" title="Green"></button>
          <button type="button" class="swatch" data-bg="#a5d8ff" style="--swatch:#a5d8ff" title="Blue"></button>
          <button type="button" class="swatch" data-bg="#ffec99" style="--swatch:#ffec99" title="Yellow"></button>
          <span class="swatch-divider"></span>
          <span class="swatch-custom" title="Custom background">
            <input id="bg-color" type="color" value="#b2f2bb" />
          </span>
        </div>
      </div>

      <div class="prop-group" id="fillGroup" data-tab="background">
        <label class="prop-label">Fill</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-fill="hachure" title="Hachure">
            <svg viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="5" y1="14" x2="11" y2="8"/><line x1="8" y1="17" x2="16" y2="9"/><line x1="13" y1="18" x2="19" y2="12"/></g><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" class="prop-btn" data-fill="cross-hatch" title="Cross-hatch">
            <svg viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><line x1="5" y1="14" x2="11" y2="8"/><line x1="8" y1="17" x2="16" y2="9"/><line x1="13" y1="18" x2="19" y2="12"/><line x1="8" y1="7" x2="16" y2="15"/><line x1="5" y1="10" x2="11" y2="16"/><line x1="13" y1="6" x2="19" y2="12"/></g><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" class="prop-btn" data-fill="solid" title="Solid">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="widthGroup" data-tab="stroke">
        <label class="prop-label">Stroke width</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-width="1" title="Thin">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="prop-btn" data-width="2" title="Medium">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="prop-btn" data-width="4" title="Bold">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="pressureGroup" data-tab="stroke">
        <label class="prop-label">Pressure</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-pressure="variable" title="Variable">
            <svg viewBox="0 0 24 24"><path d="M4 13 Q8 8 12 13 T20 13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="prop-btn" data-pressure="uniform" title="Uniform">
            <svg viewBox="0 0 24 24"><path d="M4 13 Q8 8 12 13 T20 13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="styleGroup" data-tab="stroke">
        <label class="prop-label">Stroke style</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-style="solid" title="Solid">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="prop-btn" data-style="dashed" title="Dashed">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/></svg>
          </button>
          <button type="button" class="prop-btn" data-style="dotted" title="Dotted">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 4"/></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="sloppinessGroup" data-tab="stroke">
        <label class="prop-label">Sloppiness</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-sloppiness="0" title="Architect">
            <svg viewBox="0 0 24 24"><path d="M4 14 Q12 10 20 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="prop-btn" data-sloppiness="1" title="Artist">
            <svg viewBox="0 0 24 24"><path d="M4 15 Q8 9 12 13 T20 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="prop-btn" data-sloppiness="2" title="Cartoonist">
            <svg viewBox="0 0 24 24"><path d="M4 16 Q7 8 10 14 T15 11 T20 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="prop-group hidden" id="arrowTypeGroup" data-tab="stroke">
        <label class="prop-label">Arrow type</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-arrow="straight" title="Straight">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="18" y2="6"/><polyline points="12,5 19,5 19,12"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-arrow="curved" title="Curved">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18 Q7 7 18 6"/><polyline points="13,4 19,6 15,11"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-arrow="elbow" title="Elbow">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,19 13,19 13,7"/><polyline points="9,10 13,6 17,10"/></g></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="fontFamilyGroup" data-tab="stroke">
        <label class="prop-label">Font family</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-font="hand" title="Hand-drawn">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 L14.5 7.5 L17 10 L6.5 20.5 Z"/><line x1="14.5" y1="7.5" x2="17" y2="5" /><line x1="17" y1="5" x2="19.5" y2="7.5"/><line x1="19.5" y1="7.5" x2="17" y2="10"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-font="normal" title="Normal">
            <svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="currentColor">A</text></svg>
          </button>
          <button type="button" class="prop-btn" data-font="code" title="Code">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,8 5,12 9,16"/><polyline points="15,8 19,12 15,16"/></g></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="fontSizeGroup" data-tab="stroke">
        <label class="prop-label">Font size</label>
        <div class="prop-row">
          <button type="button" class="prop-btn prop-btn-text" data-size="16" title="Small">S</button>
          <button type="button" class="prop-btn prop-btn-text" data-size="20" title="Medium">M</button>
          <button type="button" class="prop-btn prop-btn-text" data-size="28" title="Large">L</button>
          <button type="button" class="prop-btn prop-btn-text" data-size="36" title="Extra large">XL</button>
        </div>
      </div>

      <div class="prop-group" id="textAlignGroup" data-tab="stroke">
        <label class="prop-label">Text align</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-align="left" title="Left">
            <svg viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="5" y1="8" x2="19" y2="8"/><line x1="5" y1="12" x2="14" y2="12"/><line x1="5" y1="16" x2="17" y2="16"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-align="center" title="Centre">
            <svg viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="5" y1="8" x2="19" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="6" y1="16" x2="18" y2="16"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-align="right" title="Right">
            <svg viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="5" y1="8" x2="19" y2="8"/><line x1="10" y1="12" x2="19" y2="12"/><line x1="7" y1="16" x2="19" y2="16"/></g></svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="edgesGroup" data-tab="background">
        <label class="prop-label">Edges</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-edges="sharp" title="Sharp">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.5 2.5" opacity="0.55"/>
              <polyline points="6,12 6,6 12,6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="prop-btn" data-edges="round" title="Round">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.5 2.5" opacity="0.55"/>
              <path d="M6 12 V10 A4 4 0 0 1 10 6 H12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="prop-group" id="opacityGroup" data-tab="common">
        <label class="prop-label">Opacity</label>
        <input type="range" id="opacity-control" min="0" max="100" step="5" value="100" />
        <div class="slider-scale"><span>0</span><span id="opacity-text">100</span></div>
      </div>

      <div class="prop-group" id="layersGroup" data-tab="common">
        <label class="prop-label">Layers</label>
        <div class="prop-row">
          <button type="button" class="prop-btn" data-layer="back" title="Send to back">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,10 12,14 16,10"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="5" y1="19" x2="19" y2="19"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-layer="backward" title="Send backward">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,12 12,16 16,12"/><line x1="12" y1="5" x2="12" y2="16"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-layer="forward" title="Bring forward">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,12 12,8 16,12"/><line x1="12" y1="19" x2="12" y2="8"/></g></svg>
          </button>
          <button type="button" class="prop-btn" data-layer="front" title="Bring to front">
            <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,14 12,10 16,14"/><line x1="12" y1="20" x2="12" y2="10"/><line x1="5" y1="5" x2="19" y2="5"/></g></svg>
          </button>
        </div>
      </div>

      <input id="size" type="range" min="1" max="100" value="2" class="hidden" />
      <p id="size-text" class="hidden">6px</p>
      <p id="color-text" class="hidden">#1e1e1e</p>

    </div>
  </div>
</header>

<!--Canvas Board-->
<main class="board-wrap hidden">

  <!--Floaters-->
  <div class="right-top-data">
    <button type="button" id="toggleRightPanel" class="controls-toggle" aria-label="Toggle right panel" aria-expanded="false">
      <h5>States Edit</h5>
      <img class="icon" src="assets/icons/setting.png" alt="Options" />
    </button>

    <div class="right-panel-container hidden" id="rightPanelContainer">
      <div class="panel-group">
        <p class="drag-msg">Use <b>shift</b> to drag</p>

        <button class="load-state-btn" type="button">
          <img class="icon" src="./assets/icons/load.png" alt="load-img">
          <div class="text-container">
            <h5>Load Latest State</h5>
            <p>Click to load the last state you saved.</p>
          </div>
        </button>

        <button class="slide-state-btn" type="button">
          <img class="icon" src="./assets/icons/slide.png" alt="load-img">
          <div class="text-container">
            <h5>Slide State</h5>
            <p>Click to open all states and load accordingly.</p>
          </div>
        </button>

        <div class="divider-menu"></div>

        <button class="canvas-room-key hidden" type="button">
          <img class="icon" src="./assets/icons/copy.png" alt="copy-img">
          <div class="text-container">
            <h5>Canvas Topic</h5>
            <p id="canvas-topic" class="truncate-28"></p>
          </div>
        </button>

        <button class="hidden" type="button" id="peer-count-btn">
          <img class="icon" src="./assets/icons/peers.png" alt="copy-img">
          <div class="text-container">
            <h5>Peer Count</h5>
            <p id="peers-count">1</p>
          </div>
        </button>

        <div class="divider-menu"></div>

        <button class="slide-state-btn" id="save" type="button">
          <img class="icon" src="./assets/icons/download.png" alt="download-img">
          <div class="text-container">
            <h5>Save as Image</h5>
            <p>Save the canvas as image with transparent background.</p>
          </div>
        </button>

        <button class="slide-state-btn" id="save-state" type="button">
          <img class="icon" src="./assets/icons/save.png" alt="save-state-img">
          <div class="text-container">
            <h5>Save the State</h5>
            <p>Save the current canvas state.</p>
          </div>
        </button>

        <button class="slide-state-btn" id="delete-all-state" type="button">
          <img class="icon" src="./assets/icons/delete.png" alt="save-state-img">
          <div class="text-container">
          <h5>Delete all States</h5>
          <p>Delete all the states from canvas.</p>
        </div>
        </button>



        <div class="divider-menu"></div>

        <div class="name-container">
          <button class="button peer-name-container" type="button">
            <img class="icon" src="./assets/icons/arrow.png" alt="copy-img">
            <p id="local-peer-name" class="name--btn"></p>
          </button>
          <div class="hidden" id="name--input--popup">
            <input style="font-size: 12px; width: 100%" id="username-input" placeholder="Enter your name" />
            <button style="font-size: 12px;" id="username-submit">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <div id="slide-state-container" class="hidden"></div>
  <div id="slide-icon-container" class="hidden"></div>
  <div id="zoom-scale-display-container" style="">
    <button class="zoom_min">-</button><p id="zoom-scale-display">100%</p><button class="zoom_max">+</button>
  </div>
  <canvas id="board" aria-label="Drawing canvas"></canvas>
  <p id="mouse-follower">You</p>
</main>

<script src="/app.js" type="module"></script>
</body>
</html>
